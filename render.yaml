databases:
  - name: burmalda-db
    databaseName: burmalda
    user: burmalda
    plan: free
    region: frankfurt

services:
  # ---- Backend API (NestJS + Socket.io) ----
  - type: web
    name: burmalda-api
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: burmalda-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: CORS_ORIGIN
        value: https://burmalda-web.onrender.com

  # ---- Frontend (Next.js) ----
  - type: web
    name: burmalda-web
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://burmalda-api.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        value: https://burmalda-api.onrender.com
    buildFilter:
      paths:
        - apps/web/**
        - packages/shared/**
        - package.json
        - pnpm-workspace.yaml
        - tsconfig.base.json
