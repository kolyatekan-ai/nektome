app = "burmalda-api"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"
  # Build context is the monorepo root, not apps/api
  build-target = ""

# When deploying, run `fly deploy` from the monorepo root with --dockerfile apps/api/Dockerfile

[env]
  PORT = "4000"
  NODE_ENV = "production"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
